name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Dependencies are installed from uv.lock (uv sync --locked), never resolved
# fresh from pyproject ranges. This keeps CI byte-identical to the local
# toolchain — a floating `pip install -e ".[dev]"` lets newer
# crewai/fastapi/ruff releases break main without any code change.
# To upgrade dependencies: run `uv lock` locally, commit the lockfile.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Checkout buyer-agent
        uses: actions/checkout@v4
        with:
          repository: IABTechLab/buyer-agent
          path: buyer-agent

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run --locked ruff check src/

      - name: Format check
        run: uv run --locked ruff format --check src/ tests/

      - name: Unit tests
        env:
          ANTHROPIC_API_KEY: test-key-for-ci
          AD_BUYER_SRC_PATH: ${{ github.workspace }}/buyer-agent/src
          CREWAI_TELEMETRY_OPT_OUT: "true"
          CREWAI_DISABLE_TELEMETRY: "true"
          CREWAI_DISABLE_TRACKING: "true"
          LITELLM_TELEMETRY: "False"
          OTEL_SDK_DISABLED: "true"
          ANONYMIZED_TELEMETRY: "False"
          POSTHOG_DISABLED: "1"
        run: timeout --kill-after=10s 600s uv run --locked pytest tests/unit/ -v --tb=short --timeout=30 --timeout-method=thread

      - name: Integration tests
        env:
          ANTHROPIC_API_KEY: test-key-for-ci
          CREWAI_TELEMETRY_OPT_OUT: "true"
          CREWAI_DISABLE_TELEMETRY: "true"
          CREWAI_DISABLE_TRACKING: "true"
          LITELLM_TELEMETRY: "False"
          OTEL_SDK_DISABLED: "true"
          ANONYMIZED_TELEMETRY: "False"
          POSTHOG_DISABLED: "1"
        run: timeout --kill-after=10s 600s uv run --locked pytest tests/integration/ -v --tb=short --timeout=60 --timeout-method=thread
